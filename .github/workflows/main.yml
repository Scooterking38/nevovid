name: 3D PyBullet CyberArena Simulation & Video Export

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      generations:
        description: 'Number of training generations'
        required: false
        default: '60'
      frames:
        description: 'Frames to record (60 FPS, 600 = 10s)'
        required: false
        default: '600'

jobs:
  simulate-and-record:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg libgl1 libglx-mesa0 libgl1-mesa-dri libglu1-mesa

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pybullet raylib numpy lark "imageio[ffmpeg]"

      - name: Run 3D PyBullet Simulation & Render Video
        run: |
          GENS="${{ github.event.inputs.generations || '60' }}"
          FRAMES="${{ github.event.inputs.frames || '600' }}"
          echo "Running 3D PyBullet simulation ($GENS generations, $FRAMES frames)..."
          
          # xvfb-run provides the virtual OpenGL/GLX display buffer for camera rendering
          xvfb-run -a -s "-screen 0 1920x1080x24" python demo.py \
            --video cyber_arena_bullet3d.mp4 \
            --frames "$FRAMES" 

      - name: Upload 3D Simulation Video
        uses: actions/upload-artifact@v4
        with:
          name: cyber-arena-3d-video
          path: cyber_arena_bullet3d.mp4
          if-no-files-found: error
